<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fynn Bill Reminder</title>
<meta name="theme-color" content="#6d5ae6">
<meta name="description" content="Never pay a utility bill late again.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fynn">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#6b7480;--line:#e3e6ea;--accent:#2563eb;--accent-text:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--badge-bg:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111418;--card:#1a1f25;--text:#eef1f4;--muted:#9aa4b0;--line:#2a313a;--accent:#60a5fa;--accent-text:#0b1220;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--badge-bg:#252c35}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111418;--card:#1a1f25;--text:#eef1f4;--muted:#9aa4b0;--line:#2a313a;--accent:#60a5fa;--accent-text:#0b1220;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--badge-bg:#252c35}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.95rem;border:1px solid var(--line);background:var(--card)}
.alert.bad{border-color:var(--bad);color:var(--bad)}
.alert.warn{border-color:var(--warn);color:var(--warn)}
.alert.ok{color:var(--ok);border-color:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.25rem}
.stat span{color:var(--muted);font-size:.82rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
form{display:grid;gap:10px}
label{font-size:.82rem;color:var(--muted);display:grid;gap:4px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;background:var(--accent);color:var(--accent-text);font-weight:600}
button.ghost{background:var(--badge-bg);color:var(--text);font-weight:500}
button.danger{background:transparent;color:var(--bad);font-weight:500}
.bill{display:grid;gap:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:650}
.meta{color:var(--muted);font-size:.85rem}
.amt{font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:.75rem;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--badge-bg)}
.badge.bad{color:var(--bad)}.badge.warn{color:var(--warn)}.badge.ok{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
h2{font-size:1rem;margin:18px 0 8px}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.tabs{display:flex;gap:8px;margin:0 0 12px}.tabs button{flex:1}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:.72rem;color:var(--muted)}
.day{aspect-ratio:1;min-height:40px;border-radius:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:2px;font-size:.85rem;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day.blank{background:transparent;border:0}.day.today{border-color:var(--accent)}.day.sel{background:var(--accent);color:var(--accent-text)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:inline-block}.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}
.sync{font-size:.78rem;color:var(--muted);margin:-6px 0 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}.brand svg{width:52px;height:52px;flex:none;filter:drop-shadow(0 4px 10px rgba(99,102,241,.35))}.brand .sub{margin:0}
.shield{display:flex;gap:14px;align-items:center}.shield svg{width:56px;height:64px;flex:none}.shield .st{flex:1;min-width:0}.shield b{font-size:1.05rem}.shield .meta{margin-top:2px}
.bar{height:8px;background:var(--badge-bg);border-radius:99px;overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.3s;z-index:20;max-width:90%;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:0;width:9px;height:14px;border-radius:2px;z-index:19;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),100vh) rotate(var(--rot));opacity:.9}}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.06)}}
</style>
</head>
<body>
<main>
  <div class="top-bar">
    <div class="brand"><svg viewBox="0 0 64 64" role="img" aria-label="Fynn logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M12 5h42v13H26v9h19v13H26v19H12z" transform="translate(8 0) skewX(-8)" fill="#fff" fill-opacity=".24"/><circle cx="32" cy="13" r="2.5" fill="#fff"/><path d="M32 15c-8 0-13 6-13 14v8l-4 6h34l-4-6v-8c0-8-5-14-13-14z" fill="#fff"/><path d="M27 47h10a5 5 0 0 1-10 0z" fill="#fff"/><path d="M26 31l4 4 8-8" fill="none" stroke="#6d5ae6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="17" r="6" fill="#f59e0b" stroke="#6d5ae6" stroke-width="2"/></svg><div><h1>Fynn Bill Reminder</h1><p class="sub">Never pay a utility bill late again.</p></div></div>
    <button class="ghost" id="themeBtn" type="button" aria-label="Toggle theme">Theme</button>
  </div>

  <div class="sync" id="sync"></div>
  <div class="tools"><button class="ghost" id="notifBtn" type="button">Turn on reminders</button><select id="curDef" aria-label="Default currency" style="width:auto"></select></div>
  <div id="alerts"></div>
  <div class="card shield" id="shield"></div>
  <div class="stats" id="stats"></div>

  <div class="card">
    <form id="form" autocomplete="off">
      <label>Bill name<input id="name" required maxlength="40" placeholder="Electricity"></label>
      <div class="row">
        <label>Amount<input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="85.00"></label>
        <label>Currency<select id="cur"></select></label>
      </div>
      <div class="row">
        <label>Due date<input id="due" type="date" required></label>
        <label>Repeats<select id="repeat"><option value="monthly">Monthly</option><option value="none">One time</option></select></label>
        <label>Remind me<select id="remind"><option value="1">1 day before</option><option value="3" selected>3 days before</option><option value="7">7 days before</option></select></label>
        <label>Late fee if missed<input id="fee" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Optional"></label>
      </div>
      <button type="submit">Add bill</button>
    </form>
  </div>

  <div class="tabs"><button data-tab="list" type="button">List</button><button class="ghost" data-tab="cal" type="button">Calendar</button></div>
  <div id="listView"><h2>Upcoming</h2><div id="list"></div></div>
  <div id="calView" hidden><div class="card"><div class="cal-head"><button class="ghost" id="prevM" type="button" aria-label="Previous month">‹</button><b id="monthLbl"></b><button class="ghost" id="nextM" type="button" aria-label="Next month">›</button></div><div class="grid" id="grid"></div></div><div id="dayList"></div></div>

  <h2 id="paidHead" hidden>Recently paid</h2>
  <div id="paid"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var KEY="billReminder.v1", NKEY="billReminder.notified.v1";
  var CURS=["USD","EUR","GBP","GHS","NGN","ZAR","KES","UGX","TZS","XOF","XAF","EGP","MAD","ZMW","RWF","ETB","CAD","AUD","NZD","JPY","CNY","INR","PKR","BDT","LKR","IDR","MYR","SGD","THB","PHP","VND","KRW","HKD","TWD","AED","SAR","QAR","KWD","ILS","TRY","CHF","SEK","NOK","DKK","PLN","CZK","HUF","RON","RUB","UAH","MXN","BRL","ARS","CLP","COP","PEN","JMD","TTD"];
  var S={bills:[],cur:"USD",ts:0,sh:{streak:0,best:0,saved:{},paid:0}}, tab="list", cm=new Date(), sel=null, ref=null, timer=null;
  function $(i){return document.getElementById(i);}
  function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function fmt(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x;}
  function daysUntil(s){return Math.round((parse(s)-today())/86400000);}
  function addMonth(s){var d=parse(s),n=new Date(d.getFullYear(),d.getMonth()+2,0).getDate();return fmt(new Date(d.getFullYear(),d.getMonth()+1,Math.min(d.getDate(),n)));}
  function money(n,c){n=Number(n)||0;try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c||S.cur}).format(n);}catch(e){return (c||"")+" "+n.toFixed(2);}}
  function nice(s){return parse(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function setSync(t){$("sync").textContent=t;}

  function adopt(o){S.bills=o.bills||[];S.cur=o.cur||"USD";S.ts=o.ts||0;S.sh=o.sh||{streak:0,best:0,saved:{},paid:0};S.bills.forEach(function(b){if(!b.cur)b.cur=S.cur;});}
  function load(){try{var r=JSON.parse(localStorage.getItem(KEY)||"null");if(Array.isArray(r))adopt({bills:r});else if(r&&r.bills)adopt(r);}catch(e){}}
  function store(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  function push(){
    if(!ref)return;clearTimeout(timer);
    timer=setTimeout(function(){
      ref.set({bills:S.bills,cur:S.cur,ts:S.ts,sh:S.sh}).then(function(){setSync("Synced across your devices");}).catch(function(){setSync("Sync failed. Saved on this device.");});
    },600);
  }
  function save(){S.ts=Date.now();store();push();}

  function status(b){
    var d=daysUntil(b.due);
    if(d<0)return {cls:"bad",text:"Overdue by "+(-d)+(d===-1?" day":" days"),d:d};
    if(d===0)return {cls:"bad",text:"Due today",d:d};
    if(d<=b.remind)return {cls:"warn",text:"Due in "+d+(d===1?" day":" days"),d:d};
    return {cls:"ok",text:"Due in "+d+" days",d:d};
  }
  function totals(list){
    var m={};list.forEach(function(b){var c=b.cur||S.cur;m[c]=(m[c]||0)+(Number(b.amount)||0);});
    var k=Object.keys(m);return k.length?k.map(function(c){return money(m[c],c);}).join(" · "):"—";
  }
  function billCard(b){
    var s=status(b);
    return '<div class="card bill"><div class="top"><div><div class="name">'+esc(b.name)+'</div><div class="meta">'+nice(b.due)+' · '+(b.repeat==="monthly"?"Monthly":"One time")+'</div></div><div class="amt">'+(b.amount?money(b.amount,b.cur):"—")+'</div></div>'+
      '<div><span class="badge '+s.cls+'">'+s.text+'</span></div>'+
      '<div class="actions"><button data-act="pay" data-id="'+b.id+'">Mark paid</button><button class="ghost" data-act="snooze" data-id="'+b.id+'">Push 1 week</button><button class="danger" data-act="del" data-id="'+b.id+'">Delete</button></div></div>';
  }

  function renderCal(act){
    var y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),h="",t=fmt(today());
    $("monthLbl").textContent=cm.toLocaleDateString(undefined,{month:"long",year:"numeric"});
    ["S","M","T","W","T","F","S"].forEach(function(d){h+='<div class="dow">'+d+'</div>';});
    for(var i=0;i<first;i++)h+='<div class="day blank"></div>';
    for(var d=1;d<=n;d++){
      var ds=fmt(new Date(y,m,d));
      var dots=act.filter(function(b){return b.due===ds;}).slice(0,3).map(function(b){return '<i class="dot '+status(b).cls+'"></i>';}).join("");
      h+='<button type="button" class="day'+(ds===t?" today":"")+(ds===sel?" sel":"")+'" data-day="'+ds+'">'+d+'<span style="display:flex;gap:2px;height:6px">'+dots+'</span></button>';
    }
    $("grid").innerHTML=h;
    if(!sel){$("dayList").innerHTML='<div class="empty">Tap a day to see its bills.</div>';return;}
    var sb=act.filter(function(b){return b.due===sel;});
    $("dayList").innerHTML=sb.length?'<h2>'+nice(sel)+'</h2>'+sb.map(billCard).join(""):'<div class="empty">Nothing due on '+nice(sel)+'.</div>';
  }

  function render(){
    var act=S.bills.filter(function(b){return !b.paidOnly;}).sort(function(a,b){return a.due<b.due?-1:1;});
    var paid=S.bills.filter(function(b){return b.paidOnly;});
    var over=act.filter(function(b){return status(b).d<0;}), soon=act.filter(function(b){var s=status(b);return s.d>=0&&s.cls!=="ok";});
    var h="";
    if(over.length)h+='<div class="alert bad"><b>'+over.length+' overdue:</b> '+over.map(function(b){return esc(b.name);}).join(", ")+'</div>';
    if(soon.length)h+='<div class="alert warn"><b>Coming up:</b> '+soon.map(function(b){return esc(b.name)+" ("+status(b).text.toLowerCase()+")";}).join(", ")+'</div>';
    if(!over.length&&!soon.length&&act.length)h+='<div class="alert ok">You’re all caught up. Nothing due soon.</div>';
    $("alerts").innerHTML=h;
    var t=today(),mo=act.filter(function(b){var d=parse(b.due);return d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear();});
    $("stats").innerHTML='<div class="stat"><b>'+totals(mo)+'</b><span>Due this month</span></div><div class="stat"><b>'+act.length+'</b><span>Active bills · '+totals(act)+'</span></div>';
    renderShield(over);$("list").innerHTML=act.length?act.map(billCard).join(""):'<div class="empty">No bills yet. Add your first one above.</div>';
    $("paidHead").hidden=!paid.length;
    $("paid").innerHTML=paid.slice(-5).reverse().map(function(b){return '<div class="card"><div class="top"><div><div class="name">'+esc(b.name)+'</div><div class="meta">Paid '+nice(b.paidOn)+'</div></div><div class="amt">'+(b.amount?money(b.amount,b.cur):"—")+'</div></div></div>';}).join("");
    $("listView").hidden=tab!=="list";$("calView").hidden=tab!=="cal";
    document.querySelectorAll("[data-tab]").forEach(function(x){var on=x.getAttribute("data-tab")===tab;x.classList.toggle("ghost",!on);});
    if(tab==="cal")renderCal(act);
  }

  var LV=[["Bronze",0,"#cd7f32"],["Silver",3,"#94a3b8"],["Gold",6,"#f59e0b"],["Diamond",12,"#22d3ee"]];
  function renderShield(over){
    var sh=S.sh,lv=LV[0],nx=LV[1];
    LV.forEach(function(l,i){if(sh.streak>=l[1]){lv=l;nx=LV[i+1]||null;}});
    var cracked=over.length>0,col=cracked?"#94a3b8":lv[2];
    var saved=Object.keys(sh.saved).map(function(c){return money(sh.saved[c],c);}).join(" · ")||money(0,S.cur);
    var pct=nx?Math.min(100,Math.round((sh.streak-lv[1])/(nx[1]-lv[1])*100)):100;
    var left=nx?nx[1]-sh.streak:0;
    var msg=cracked?"Your shield is cracked. Pay "+esc(over[0].name)+" to start rebuilding.":!sh.paid?"Pay bills on time to build your shield.":nx?left+" more on-time "+(left===1?"payment":"payments")+" to reach "+nx[0]:"Top level reached. Keep it up!";
    $("shield").innerHTML='<svg viewBox="0 0 48 56" aria-hidden="true"><path d="M24 3 5 10v16c0 13 8 22 19 27 11-5 19-14 19-27V10z" fill="'+col+'"/>'+(cracked?'<path d="M24 3l-4 13 8 9-7 12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>':'<path d="M15 28l6 6 12-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>')+'</svg>'+
      '<div class="st"><b>Fynn Shield · '+(cracked?"Cracked":lv[0])+'</b><div class="meta">Streak '+sh.streak+' · Best '+sh.best+' · Late fees dodged '+saved+'</div><div class="bar"><i style="width:'+(cracked?0:pct)+'%"></i></div><div class="meta">'+msg+'</div></div>';
  }
  function lvName(n){var r=LV[0][0];LV.forEach(function(l){if(n>=l[1])r=l[0];});return r;}
  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on");},2800);}
  function confetti(n){
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    var cols=["#3b82f6","#7c3aed","#f59e0b","#22c55e","#ef4444","#22d3ee"];
    for(var i=0;i<n;i++){var e=document.createElement("i");e.className="conf";e.style.left=(10+Math.random()*80)+"vw";e.style.background=cols[i%cols.length];e.style.setProperty("--dx",(Math.random()*160-80)+"px");e.style.setProperty("--rot",(Math.random()*720)+"deg");e.style.animationDelay=(Math.random()*0.3)+"s";document.body.appendChild(e);setTimeout(e.remove.bind(e),2300);}
  }
  function celebrate(late,lv0,b){
    if(late){toast("Paid. Your streak reset, but you’re back on track.");return;}
    var lv1=lvName(S.sh.streak);
    if(lv1!==lv0){confetti(70);toast("🎉 Level up! You reached "+lv1+" Shield");var c=$("shield");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");}
    else{confetti(24);toast("✅ On time! Streak "+S.sh.streak+(b.fee?" · saved "+money(b.fee,b.cur)+" in late fees":""));}
  }
  function fillCur(sel_,val){sel_.innerHTML=CURS.map(function(c){return '<option'+(c===val?" selected":"")+'>'+c+'</option>';}).join("");}

  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    var name=$("name").value.trim(),due=$("due").value;if(!name||!due)return;
    S.bills.push({id:String(Date.now())+Math.floor(Math.random()*1000),name:name,amount:parseFloat($("amount").value)||0,cur:$("cur").value,due:due,repeat:$("repeat").value,remind:parseInt($("remind").value,10),fee:parseFloat($("fee").value)||0});
    save();e.target.reset();$("remind").value="3";$("cur").value=S.cur;$("due").value=fmt(today());render();checkNotify();
  });

  function onAct(e){
    var btn=e.target.closest("button[data-act]");if(!btn)return;
    var id=btn.getAttribute("data-id"),i=S.bills.findIndex(function(b){return b.id===id;});if(i<0)return;
    var b=S.bills[i],a=btn.getAttribute("data-act");
    if(a==="pay"){var lv0=lvName(S.sh.streak);var late=daysUntil(b.due)<0;S.sh.paid++;if(late){S.sh.streak=0;}else{S.sh.streak++;S.sh.best=Math.max(S.sh.best,S.sh.streak);if(b.fee)S.sh.saved[b.cur]=(S.sh.saved[b.cur]||0)+b.fee;}S.bills.push({id:String(Date.now()),name:b.name,amount:b.amount,cur:b.cur,due:b.due,paidOnly:true,paidOn:fmt(today()),late:late});celebrate(late,lv0,b);if(b.repeat==="monthly")b.due=addMonth(b.due);else S.bills.splice(i,1);}
    else if(a==="snooze")b.due=fmt(new Date(parse(b.due).getTime()+7*86400000+3600000));
    else if(a==="del")S.bills.splice(i,1);
    save();render();
  }
  $("list").addEventListener("click",onAct);
  $("dayList").addEventListener("click",onAct);
  $("grid").addEventListener("click",function(e){var d=e.target.closest("[data-day]");if(d){sel=d.getAttribute("data-day");render();}});
  $("prevM").addEventListener("click",function(){cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);render();});
  $("nextM").addEventListener("click",function(){cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);render();});
  document.querySelectorAll("[data-tab]").forEach(function(x){x.addEventListener("click",function(){tab=x.getAttribute("data-tab");render();});});
  $("curDef").addEventListener("change",function(){S.cur=$("curDef").value;$("cur").value=S.cur;save();render();});
  $("themeBtn").addEventListener("click",function(){
    var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    r.setAttribute("data-theme",dark?"light":"dark");
  });

  /* Reminders (Notification API; works while the page is open) */
  function perm(){try{return ("Notification" in window)?Notification.permission:"unsupported";}catch(e){return "unsupported";}}
  function updNotif(){
    var p=perm(),b=$("notifBtn");
    b.textContent=p==="granted"?"Reminders on":p==="denied"?"Reminders blocked":p==="unsupported"?"Reminders unavailable":"Turn on reminders";
    b.disabled=(p==="denied"||p==="unsupported");
  }
  function checkNotify(){
    if(perm()!=="granted")return;
    var done={};try{done=JSON.parse(localStorage.getItem(NKEY)||"{}");}catch(e){}
    var t=fmt(today()),changed=false;
    S.bills.forEach(function(b){
      if(b.paidOnly)return;var s=status(b);if(s.cls==="ok")return;
      var k=b.id+"|"+b.due+"|"+t;if(done[k])return;
      try{new Notification("Bill reminder: "+b.name,{body:s.text+(b.amount?" · "+money(b.amount,b.cur):"")});done[k]=1;changed=true;}catch(e){}
    });
    if(changed){Object.keys(done).forEach(function(k){if(k.split("|")[2]!==t)delete done[k];});try{localStorage.setItem(NKEY,JSON.stringify(done));}catch(e){}}
  }
  $("notifBtn").addEventListener("click",function(){
    if(perm()==="default"){try{Notification.requestPermission().then(function(){updNotif();checkNotify();});}catch(e){}}
    else if(perm()==="granted"){try{new Notification("Reminders are on",{body:"You’ll be alerted while this page is open."});}catch(e){}}
  });

  /* Sync (private per person) */
  async function initSync(){
    setSync("Saved on this device");
    try{
      if(!window.claude||!claude.use)return;
      var u=await claude.use("user"),d=await claude.use("db");
      if(!u||!d)return;
      var id=await u.id();if(!id)return;
      ref=d.collection("data/users/"+id).doc("bills");
      var wait=setTimeout(function(){setSync("Can’t reach sync yet. Saved on this device.");},10000);
      ref.onSnapshot(function(snap){
        clearTimeout(wait);
        var r=snap.exists?snap.data():null;
        if(r&&(r.ts||0)>S.ts){adopt(r);store();render();checkNotify();setSync("Synced across your devices");}
        else if(!r&&S.bills.length){if(!S.ts)S.ts=Date.now();store();push();}
        else if(r&&(r.ts||0)<S.ts)push();
        else setSync("Synced across your devices");
      },function(){clearTimeout(wait);setSync("Sync unavailable. Saved on this device.");});
    }catch(e){setSync("Saved on this device");}
  }

  load();
  fillCur($("cur"),S.cur);fillCur($("curDef"),S.cur);
  $("due").value=fmt(today());
  render();updNotif();checkNotify();initSync();
  setInterval(function(){checkNotify();if(tab==="list"||tab==="cal")render();},60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){render();checkNotify();}});
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
